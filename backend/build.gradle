plugins {
  id 'org.springframework.boot' version '4.0.5'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'java'
}

group = 'com.leucine.setup'
version = '0.1.0'
description = 'Streem Setup — local provisioning tool for streem-backend instances'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

repositories {
  mavenCentral()
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-jdbc'
  implementation 'org.springframework.boot:spring-boot-starter-json'
  implementation 'com.fasterxml.jackson.core:jackson-databind'

  // BCrypt only (no full Security starter — we don't want auth filters)
  implementation 'org.springframework.security:spring-security-crypto'

  // SSH tunneling (active mwiede fork of the long-stagnant com.jcraft:jsch)
  implementation 'com.github.mwiede:jsch:0.2.21'

  // Local store (SQLite) + target DB (Postgres) drivers
  runtimeOnly 'org.xerial:sqlite-jdbc:3.46.1.0'
  runtimeOnly 'org.postgresql:postgresql:42.7.4'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
  archiveFileName = "streem-setup.jar"
}

test {
  useJUnitPlatform()
}
